schema_version = 2

# Clean fuxi (Xiaomi 13, SM8550 8/256) device repository on upstream UniXNU.
# Hardware values measured on this unit (TWRP + stock DT):
# touch ST FTM5 fw 53.42 vendor 56 SPI0, panel m3_38_0c_0a, UFS HC 0x1d84000,
# userdata 4096B first_lba 3635264 last_lba 61850616, DarwinBoot window
# 0x8C007C000+0x130000000, 8 GB RAM map (uefi-fuxi c5793bc2), ABL fastboot boot only.

[board]
name = "fuxi"
soc = "SM8550"
soc_source = "sm8550"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi 13"
kit = "fuxi"

[userdata]
# GPT "userdata" of UFS LUN 0, measured in TWRP on this 8/256 unit (blockdev/sda32):
# 512B start 29082112 size 465722824 -> 4096B first_lba 3635264 last_lba 61850616.
# Android data occupies the head (~72 GB used); the unixnu carve (Task 7) takes the tail.
first_lba = 3635264
last_lba = 61850616
lba_bytes = 4096

[components]
# Task 4: QcomGeniSpi (upstream SPI engine the FTM5 hangs off). The FTM5 protocol
# itself (package/FuxiFtsTouch) is NOT an upstream catalog component — it is built
# by scripts/build-fuxi-touch.py straight from the vendored sources; the HID
# digitizer by build-fuxi-hid-input.py.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "QcomGeniSpi", "ShengUfs"]

[kernel]
defconfig = "fuxi_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# Auxiliary archives. NOTE: this list REPLACES the arch profile defaults
# (profiles/arch/arm64/profile.toml), it does not extend them — so the eight
# defaults are repeated here verbatim, with our script appended last.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "component:ShengUfs",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "build-fuxi-platform-power.py",
  "build-fuxi-hid-input.py",
  "build-fuxi-touch.py",
  "build-fuxi-ufs.py",
]

[device_tree]
source = "device:dts/fuxi.dts"
include_dirs = ["soc:dts"]

[firmware]
# uefi-fuxi branch fuxi (proven 8 GB memory map on this unit). Only FW input, not a build dependency.
config = "fuxi"
dsc = "Platforms/Xiaomi/fuxiPkg/fuxi.dsc"
fd = "Build/fuxiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu",
            "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI",
            "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicon/Silicium"]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "fuxi"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "fuxi-clean"

# fastboot boot only, nothing flashed. v0 container (ABL rejects header v4),
# shim text offset 0 (ABL refuses ARM64 header with firmware address),
# payload rides after the firmware volume (FuxiBootMemoryDxe).
[bootimg]
payload = "image"

[bootimg.image]
header_version = 0
base = 0x00000000
kernel_offset = 0x00008000
tags_offset = 0x01e00000
pagesize = 4096
text_offset = 0

[payload]
volume = "FUXIESP"
# ABL fuxi boots an 11 MB image but hangs on 144/270 MB ones (black screen,
# stays in fastboot). Probe with a tight volume: kernel (~52 MB) + trustcache
# + ADT fit in 80 MiB; total image ~85 MB. If this still hangs, the next probe
# is a firmware-only (ramdisk none) menu image.
size_mib = 80
# Entry probe bars + panic screen (--no-reset): stage 3's reset cave and the
# 0xa1f-byte panic screen do not fit together in the entry padding (the patcher
# refuses: panic load + len overruns PANIC_CAVE_END). Bars show whether the
# kernel entry ran (blue) and reached the MMU point (magenta); the panic
# screen renders any early panic text instead of a timed reboot signal.
panic_screen = true
loader = "firmware"
title = "UniXNU"
# Baseline: verbose + serial + debug. sheng-pmgr=2 publishes the original ApplePMGRNub
# AMFI waits for (the bridge refuses every power operation, it is not power management).
# fuxi-touch=4 runs the FTM5 probe through sensing, fuxi-touch-hid=1 starts the HID
# digitizer (sheng-touch-hid=1 gives it the collection), fuxi-touch-panic=2 panics
# with the probe rows after the first lift so the table can be read from the screen.
kernel_args = ["-v", "serial=3", "debug=0x14e", "sheng-smp=1", "armcpu-spi-ipi=1", "armcpu-self-ipi=1", "sheng-pmgr=2", "fuxi-touch=4", "fuxi-touch-hid=1", "sheng-touch-hid=1", "fuxi-touch-panic=2", "native-ufs-probe=10"]

[payload.adt]
chip_id = "207"
unique_chip_id = "required"
# Memory DarwinBoot gives XNU on this unit.
owned_memory_size = "0x130000000"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "fuxi_defconfig"
